# bundle patch for the dsh-i18n-ja-core language pack plugin: inserts its
# plugin row into the profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field). The single row mounts BOTH halves: the
# host half is a no-op (pure browser plugin) and the browser half registers
# the 日本語 language + the ja dictionaries for the DSH core plugin
# namespaces (common, settings.*, chat, …). The namespace set is disjoint
# from dsh-i18n-ja, so both packs can be enabled at the same time.
- insert:
    - id: i18n-ja-core
      name: 'dsh-i18n-ja-core'
