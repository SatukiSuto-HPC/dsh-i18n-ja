name: Publish to npm (trusted publishing, OIDC)

# 認証は GitHub OIDC クレデンシャルのみ。NPM_TOKEN 等のシークレットは不要。
# 手順: git tag v<version> && git push origin v<version>
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing + provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
        # 注意: registry-url を指定しないこと。指定すると setup-node が
        # NODE_AUTH_TOKEN（GitHub トークン）を .npmrc に書き込み、
        # Trusted Publishing の OIDC 認証を妨害する。

      # Trusted Publishing には npm >= 11.3 が必要（Node 22 同梱の npm 10 では OIDC 不可）
      - run: npm install -g npm@11

      - name: Verify tag matches package versions
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in packages/dsh-i18n-ja packages/dsh-i18n-ja-core; do
            V=$(node -p "require('./$p/package.json').version")
            if [ "$V" != "$TAG" ]; then
              echo "::error::$p version ($V) does not match tag ($TAG)"
              exit 1
            fi
          done

      - name: Publish dsh-i18n-ja
        working-directory: packages/dsh-i18n-ja
        run: npm publish --provenance --access public

      - name: Publish dsh-i18n-ja-core
        working-directory: packages/dsh-i18n-ja-core
        run: npm publish --provenance --access public
